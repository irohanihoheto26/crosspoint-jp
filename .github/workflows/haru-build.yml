name: Haru X3 build

on:
  push:
    branches: ['haru/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: haru-pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'scripts/patch_pioarduino_cache.py') }}
          restore-keys: haru-pio-${{ runner.os }}-

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          pio pkg install -e gh_release
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"

      - name: Build firmware (X3/X4)
        run: |
          set -euo pipefail
          pio run -e gh_release | tee pio.log
          grep -E "RAM:|Flash:" pio.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: Make full flash image (bootloader + partitions + app)
        run: |
          set -euo pipefail
          B=.pio/build/gh_release
          BOOTAPP=$(find ~/.platformio/packages/framework-arduinoespressif32* -name boot_app0.bin | head -1)
          mkdir -p out
          cp $B/firmware.bin out/firmware.bin
          python -m esptool --chip esp32c3 merge-bin -o out/firmware-full-16MB.bin \
            --flash-mode dio --flash-size 16MB \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOTAPP" 0x10000 $B/firmware.bin \
          || ~/.platformio/penv/bin/python -m esptool --chip esp32c3 merge_bin -o out/firmware-full-16MB.bin \
            --flash_mode dio --flash_size 16MB \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOTAPP" 0x10000 $B/firmware.bin
          ls -l out

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: firmware-x3
          path: out/
          if-no-files-found: error
